name: Pruebas y build

on:
  push:
    branches: ["**"]
  pull_request:
    branches: [main, master]

jobs:

  backend-tests:

    runs-on: ubuntu-latest

    services:

      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root_password_ci
          MYSQL_DATABASE: thermo_iot_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h localhost"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=15

    steps:

      - name: Descargar el código
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: backend/package-lock.json

      - name: Instalar dependencias del backend
        working-directory: backend
        run: npm ci

      - name: Lint del backend
        working-directory: backend
        run: npm run lint

      - name: Cargar la estructura de la base de datos de pruebas
        run: |
          # schema.sql trae su propio CREATE DATABASE/USE thermo_iot,
          # que pisaría el nombre de la base de pruebas si lo
          # cargáramos tal cual — lo adaptamos primero, igual que se
          # hace manualmente en desarrollo.
          sed 's/thermo_iot/thermo_iot_test/g' backend/schema.sql > /tmp/schema_test.sql
          mysql -h 127.0.0.1 -P 3306 -uroot -proot_password_ci < /tmp/schema_test.sql

      - name: Crear el .env.test para esta ejecución
        working-directory: backend
        run: |
          cat > .env.test << EOF
          DB_HOST=127.0.0.1
          DB_USER=root
          DB_PASSWORD=root_password_ci
          DB_NAME=thermo_iot_test
          JWT_SECRET=ci_test_secret
          DEVICE_API_KEY=ci_test_device_key
          PORT=3099
          EOF

      - name: Correr las pruebas automatizadas
        working-directory: backend
        run: npm test

  frontend-checks:

    runs-on: ubuntu-latest

    steps:

      - name: Descargar el código
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Instalar dependencias del frontend
        working-directory: frontend
        run: npm ci

      - name: Lint del frontend
        working-directory: frontend
        run: npm run lint

      - name: Correr las pruebas automatizadas del frontend
        working-directory: frontend
        run: npm test

      - name: Verificar que el frontend compile sin errores
        working-directory: frontend
        run: npm run build
